plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}
group = 'dev.aquamiraenouveau'
version = file('VERSION').text.trim()
base { archivesName = 'aquamirae-nouveau' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
repositories { mavenCentral() }
sourceSets.main { java.srcDir 'common/src/main/java'; resources.srcDir 'common/src/main/resources' }
sourceSets { gameTest { compileClasspath += sourceSets.main.output; runtimeClasspath += sourceSets.main.output } }
configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestCompileOnly.extendsFrom compileOnly
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}
evaluationDependsOn(':ars-conflux')
neoForge {
    version = '21.1.250'
    addModdingDependenciesTo sourceSets.gameTest
    runs {
        client { client(); gameDirectory = file('run/client') }
        server { server(); gameDirectory = file('run/server'); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'aquamirae_nouveau'
            jvmArgument '-Xmx2G'
        }
    }
    mods {
        ars_conflux { sourceSet project(':ars-conflux').sourceSets.main }
        aquamirae_nouveau { sourceSet sourceSets.main; sourceSet sourceSets.gameTest }
    }
}
dependencies {
    implementation project(':ars-conflux')
    compileOnly fileTree(dir: 'libs', include: '*.jar')
    runtimeOnly fileTree(dir: 'libs', include: '*.jar')
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: project.version) }
}
tasks.named('jar') {
    from('LICENSE', 'THIRD_PARTY_NOTICES.md')
    archiveFileName = "aquamirae-nouveau-${project.version}-mc1.21.1-neoforge.jar"
}
tasks.named('sourcesJar') { from('LICENSE', 'THIRD_PARTY_NOTICES.md') }
